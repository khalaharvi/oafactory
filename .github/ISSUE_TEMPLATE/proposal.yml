name: Proposal
description: A new capability, or a change to the specification
labels: [proposal]
body:
  - type: textarea
    id: problem
    attributes: { label: The problem, description: What can you not do today, or what goes wrong? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: What you propose }
    validations: { required: true }
  - type: textarea
    id: trust
    attributes: { label: Effect on the trust boundaries, description: "Does this change what the Worker can see, do or influence? Does it change what counts as evidence?" }
  - type: textarea
    id: alternatives
    attributes: { label: Alternatives considered }
