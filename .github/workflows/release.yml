# Tags and publishes a release when a new version lands on main.
#
# A release is a pull request that sets the version in packages/oafactory/package.json and
# moves the changelog's Unreleased entries under that version. When it merges, this workflow
# sees a version with no tag yet, runs the tests, and creates the tag and the GitHub release.
name: Release
on:
  push:
    branches: [main]
    paths: [packages/oafactory/package.json, CHANGELOG.md, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find the version and whether it is already tagged
        id: version
        run: |
          version="$(node -p "require('./packages/oafactory/package.json').version")"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
            echo "v$version is already tagged; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Take this version's entry from the changelog
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 {on=1; next} on && /^## \[/ {exit} on && /^\[[^]]+\]: / {next} on' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no entry for $VERSION"
            exit 1
          fi
      - uses: actions/setup-node@v4
        if: steps.version.outputs.release == 'true'
        with: { node-version: 22, cache: npm }
      - name: Test and build
        if: steps.version.outputs.release == 'true'
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Create the tag and the GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file release-notes.md
