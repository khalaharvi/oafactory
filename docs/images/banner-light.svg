<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="OAFactory: an open software factory. Agents write the code. Evidence decides what merges.">
  <rect width="1200" height="420" rx="18" fill="#faf7f2"/>
  <g transform="translate(64 78)" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-width="2.6">
    <path d="M0 30V12l10 7v-7l10 7V2h10v28Z" stroke="#1c1917"/><path d="M8 30v-5M16 30v-5M24 30v-5" stroke="#a84a08"/>
  </g>
  <text x="108" y="104" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#1c1917">OAFactory</text>
  <text x="64" y="158" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" letter-spacing="1.6" fill="#a84a08">AN OPEN SOFTWARE FACTORY</text>
  <text font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="50" font-weight="600" fill="#1c1917" letter-spacing="-0.8"><tspan x="62" y="222">Agents write the code.</tspan><tspan x="62" y="282">Evidence decides what merges.</tspan></text>
  <text x="64" y="330" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#655c51">A deterministic Gate, earned autonomy, and a receipt for every run.</text>
