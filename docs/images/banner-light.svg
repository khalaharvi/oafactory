      <text x="832" y="88" fill="#655c51">acme/widgets #431</text><text x="1128" y="88" text-anchor="end" fill="#655c51">9f2c41ab77e0</text>
      <line x1="832" y1="104" x2="1128" y2="104" stroke="#655c51" stroke-dasharray="4 4" opacity="0.6"/>
