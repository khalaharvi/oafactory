name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=report/junit.xml
        working-directory: packages/oafactory
      - run: npm test -w oafactory-mcp
      # The Gate reads this artifact, for the base and the head commit, to produce test_integrity evidence.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oafactory-test-report
          path: packages/oafactory/report/junit.xml

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w web
